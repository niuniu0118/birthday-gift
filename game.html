<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>别碰我，我还要过生日！</title>
    <style>
        body {
            margin: 0; padding: 0; background: #0d0d1a; color: #ffd700;
            font-family: "Microsoft YaHei", sans-serif; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        #game-container {
            position: relative;
            border: 4px solid #4a148c;
            box-shadow: 0 0 50px rgba(138, 43, 226, 0.6);
            background: radial-gradient(circle at center, #1a1a3e, #0a0a1a);
            overflow: hidden;
            width: 95vw;
            height: 85vh;
            max-width: 1000px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #ui {
            position: absolute; top: 15px; left: 15px; font-size: 22px;
            font-weight: bold; text-shadow: 2px 2px 4px #000; pointer-events: none;
        }
        #start-screen, #end-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; padding: 20px;
        }
        h1 { color: #00e5ff; margin-bottom: 15px; font-size: 2.2rem; text-shadow: 0 0 15px #00e5ff; }
        p { font-size: 1.1rem; margin-bottom: 20px; line-height: 1.6; color: #e0d5c1; }
        button {
            padding: 12px 30px; font-size: 1.2rem; background: #4a148c; color: white;
            border: 2px solid #00e5ff; border-radius: 6px; cursor: pointer;
            font-weight: bold; transition: 0.2s; margin: 5px;
        }
        button:hover { background: #6a1b9a; transform: scale(1.05); box-shadow: 0 0 15px #00e5ff; }
        .hidden { display: none !important; }
        .gift-btn {
            background: #ffd700; color: #1a0f05; border: 2px solid #fff;
            box-shadow: 0 0 20px #ffd700; animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <audio id="winSound" src="game_voice.mp3"></audio>
    <audio id="timoSound" src="teemo-laugh_converted.wav"></audio>
    <audio id="game-bgm" src="tavern.mp3" loop></audio>
    
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div id="ui">
            <div id="timer">走位时间: 0.0s / 20.0s</div>
            <div id="hp" style="color: #00e5ff; margin-top: 5px;">精灵体力: 💎💎💎</div>
        </div>

        <!-- 开始界面 -->
        <div id="start-screen">
            <h1>✨ 别碰我，我还要过生日！</h1>
            <p>艾泽拉斯的星光乱流来袭！<br>使用【鼠标拖动】或【WASD/方向键】控制精灵灵活走位。<br>躲开越来越快的星光球，坚持 20 秒，解锁贺贺的专属惊喜！</p>
            <button id="start-btn">进入星光</button>
        </div>

        <!-- 结束界面 -->
        <div id="end-screen" class="hidden">
            <h1 id="end-title">游戏结束</h1>
            <p id="end-desc">再试一次吧！</p>
            <button id="restart-btn" style="background: #333;">再来一次</button>
            <button id="show-gift-btn" class="gift-btn hidden">🎁 领取生日惊喜</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const endScreen = document.getElementById('end-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const showGiftBtn = document.getElementById('show-gift-btn');
        const timerEl = document.getElementById('timer');
        const hpEl = document.getElementById('hp');
        const endTitle = document.getElementById('end-title');
        const endDesc = document.getElementById('end-desc');
        
        const winSound = document.getElementById('winSound');
        const timoSound = document.getElementById('timoSound');

        let gameLoop;
        let gameState = 'menu'; 
        let surviveTime = 0;
        let hp = 3;
        let enemies = [];
        let spawnInterval;

        const guguImg = new Image();
        guguImg.src = 'avatar.png'; 

        const player = { x: 400, y: 400, radius: 25, speed: 9 };

        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
        let isDragging = false;

        window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        canvas.addEventListener('mousedown', (e) => { isDragging = true; movePlayerToMouse(e); });
        canvas.addEventListener('mousemove', (e) => { if(isDragging) movePlayerToMouse(e); });
        window.addEventListener('mouseup', () => { isDragging = false; });
        
        canvas.addEventListener('touchstart', (e) => { isDragging = true; movePlayerToTouch(e); e.preventDefault(); });
        canvas.addEventListener('touchmove', (e) => { if(isDragging) movePlayerToTouch(e); e.preventDefault(); });
        window.addEventListener('touchend', () => { isDragging = false; });

        function movePlayerToMouse(e) {
            const rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left;
            player.y = e.clientY - rect.top;
        }
        
        function movePlayerToTouch(e) {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            player.x = touch.clientX - rect.left;
            player.y = touch.clientY - rect.top;
        }

        function startGame() {
            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            gameState = 'playing';
            
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            const gameBgm = document.getElementById('game-bgm');
            if (gameBgm) {
                gameBgm.volume = 0.4; 
                gameBgm.play().catch(err => console.log('音乐播放失败:', err));
            }

            surviveTime = 0;
            hp = 3;
            enemies = [];
            player.x = 400;
            player.y = 400;
            updateUI();

            if(gameLoop) cancelAnimationFrame(gameLoop);
            if(spawnInterval) clearInterval(spawnInterval);

            let lastTime = performance.now();
            function gameTimer(now) {
                if(gameState !== 'playing') return;
                let dt = (now - lastTime) / 1000;
                lastTime = now;
                surviveTime += dt;
                
                if (surviveTime >= 20) {
                    winGame();
                    return;
                }
                updateUI();
                requestAnimationFrame(gameTimer);
            }
            requestAnimationFrame(gameTimer);

            spawnInterval = setInterval(() => {
                if (gameState !== 'playing') return;
                spawnEnemy();
            }, Math.max(100, 350 - surviveTime * 10)); 

            requestAnimationFrame(update);
        }

        function spawnEnemy() {
            const edge = Math.floor(Math.random() * 4);
            let x, y;
            const speed = (2.5 + Math.random() * 2.5) + (surviveTime * 0.1); 
            const types = ['cyan', 'magenta', 'yellow'];
            const colorType = types[Math.floor(Math.random() * types.length)];

            if (edge === 0) { x = Math.random() * canvas.width; y = -20; }
            else if (edge === 1) { x = canvas.width + 20; y = Math.random() * canvas.height; }
            else if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height + 20; }
            else { x = -20; y = Math.random() * canvas.height; }

            const angle = Math.atan2(player.y - y, player.x - x);
            
            enemies.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: 12,
                color: colorType,
                phase: Math.random() * Math.PI * 2 
            });
        }

        function update() {
            if (gameState !== 'playing') return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (keys.w || keys.ArrowUp) player.y -= player.speed;
            if (keys.s || keys.ArrowDown) player.y += player.speed;
            if (keys.a || keys.ArrowLeft) player.x -= player.speed;
            if (keys.d || keys.ArrowRight) player.x += player.speed;

            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            ctx.shadowBlur = 15;
            ctx.shadowColor = '#fff';
            
            if(guguImg.complete) {
                ctx.save(); 
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip(); 
                ctx.drawImage(guguImg, player.x - player.radius, player.y - player.radius, player.radius*2, player.radius*2);
                ctx.restore(); 
                
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
                ctx.strokeStyle = '#ffd700'; 
                ctx.lineWidth = 3;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffd700';
                ctx.stroke();
                ctx.shadowBlur = 0; 
            } else {
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffd700';
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                
                e.phase += 0.05;
                e.x += e.vx + Math.sin(e.phase) * 0.5;
                e.y += e.vy + Math.cos(e.phase) * 0.5;

                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fillStyle = e.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = e.color;
                ctx.fill();
                ctx.shadowBlur = 0;

                const dist = Math.hypot(player.x - e.x, player.y - e.y);
                if (dist < player.radius + e.radius - 5) {
                    enemies.splice(i, 1);
                    takeDamage();
                } else if (e.x < -50 || e.x > canvas.width + 50 || e.y < -50 || e.y > canvas.height + 50) {
                    enemies.splice(i, 1);
                }
            }
            gameLoop = requestAnimationFrame(update);
        }

        function takeDamage() {
            hp--;
            updateUI();
            
            timoSound.currentTime = 0;
            timoSound.play().catch(e => console.log(e));

            canvas.style.transform = `translate(${Math.random()*15-7}px, ${Math.random()*15-7}px)`;
            canvas.style.borderColor = '#ff0000';
            setTimeout(() => {
                canvas.style.transform = 'translate(0,0)';
                canvas.style.borderColor = '#4a148c';
            }, 150);

            if (hp <= 0) loseGame();
        }

        function updateUI() {
            timerEl.textContent = `走位时间: ${surviveTime.toFixed(1)}s / 20.0s`;
            let diamonds = '';
            for(let i=0; i<3; i++) diamonds += (i < hp) ? '💎' : '🖤';
            hpEl.textContent = `精灵体力: ${diamonds}`;
        }

        function winGame() {
            gameState = 'over';
            cancelAnimationFrame(gameLoop);
            clearInterval(spawnInterval);
            
            const gameBgm = document.getElementById('game-bgm');
            if (gameBgm) gameBgm.pause();

            winSound.play().catch(e => console.log(e));

            endTitle.textContent = "✨ 😎 薛迪凯，就这？";
            endTitle.style.color = "#00e5ff";
            endDesc.textContent = "你完美躲开了所有星光乱流，快扫码领取贺贺的专属礼物吧！";
            
            showGiftBtn.classList.remove('hidden');
            endScreen.classList.remove('hidden');
        }

        function loseGame() {
            gameState = 'over';
            cancelAnimationFrame(gameLoop);
            clearInterval(spawnInterval);

            endTitle.textContent = "😭 精灵被晃晕了";
            endTitle.style.color = "#ffd700";
            endDesc.textContent = "星光太刺眼啦！再试一次吧！";
            
            showGiftBtn.classList.add('hidden');
            endScreen.classList.remove('hidden');
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        
        showGiftBtn.addEventListener('click', () => {
            localStorage.setItem('gameCleared', 'true');

            const wechatModal = document.createElement('div');
            wechatModal.style.cssText = `
                position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column;
                align-items: center; justify-content: center; z-index: 999;
                overflow: hidden; 
            `;

            const canvas = document.createElement('canvas');
            canvas.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;';
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            wechatModal.appendChild(canvas);

            const contentDiv = document.createElement('div');
            contentDiv.style.cssText = 'position: relative; z-index: 1000; text-align: center; background: rgba(13, 13, 26, 0.9); padding: 30px; border-radius: 15px; border: 3px solid #00e5ff; box-shadow: 0 0 30px #00e5ff;';
            contentDiv.innerHTML = `
                <h2 style="color: #ffd700; margin-bottom: 10px; text-shadow: 0 0 15px #ffd700; font-size: 2rem;">🎉 恭喜通关！</h2>
                <p style="color: #fff; margin-bottom: 20px; font-size: 1.1rem;">贺贺，快扫码加上我的微信，领取你的专属生日礼物！</p>
                <img src="wechat.png" alt="微信二维码" style="width: 200px; height: 200px; border: 3px solid #fff; border-radius: 10px; padding: 5px; background: #fff; box-shadow: 0 0 20px rgba(255,255,255,0.5);">
                <button id="close-wechat" style="display: block; margin: 20px auto 0; padding: 10px 30px; font-size: 1.1rem; background: #4a148c; color: #fff; border: 2px solid #00e5ff; border-radius: 6px; cursor: pointer;">收起</button>
            `;
            wechatModal.appendChild(contentDiv);
            document.body.appendChild(wechatModal);

            const ctx = canvas.getContext('2d');
            let particles = [];
            let animationFrameId;

            class Particle {
                constructor(x, y, color) {
                    this.x = x; this.y = y;
                    this.vx = Math.random() * 8 - 4;
                    this.vy = Math.random() * 8 - 4;
                    this.color = color;
                    this.alpha = 1;
                    this.decay = Math.random() * 0.02 + 0.015;
                    this.size = Math.random() * 3 + 1;
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    this.vy += 0.05;
                    this.alpha -= this.decay;
                }
                draw() {
                    ctx.globalAlpha = this.alpha;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            const colors = ['#ff0000', '#ffd700', '#00e5ff', '#ff69b4', '#32cd32'];

            function createFirework() {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height * 0.6;
                const color = colors[Math.floor(Math.random() * colors.length)];
                for (let i = 0; i < 50; i++) {
                    particles.push(new Particle(x, y, color));
                }
            }

            let fireworkTimer = setInterval(createFirework, 400);

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();
                    if (particles[i].alpha <= 0) particles.splice(i, 1);
                }
                animationFrameId = requestAnimationFrame(animate);
            }
            animate();

            document.getElementById('close-wechat').addEventListener('click', () => {
                clearInterval(fireworkTimer);
                cancelAnimationFrame(animationFrameId);
                wechatModal.remove();
            });
        });
    </script>
</body>
</html>
